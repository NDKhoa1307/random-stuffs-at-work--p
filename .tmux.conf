# ==========================
# General Settings
# ==========================
# Change Leader (prefix) from Ctrl+b to Ctrl+s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Enable mouse control and 256 colors
set -g mouse on
set -g default-terminal "tmux-256color"

# Move the status bar to the top
set-option -g status-position top

# ==========================
# Keybindings
# ==========================
# Split panes using " (top/bottom) and % (left/right) in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (Prefix + Shift + h/j/k/l)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable aggressive resizing 
setw -g aggressive-resize on

# ==========================
# Plugins (TPM)
# ==========================
# Tmux Plugin Manager (TPM)
set -g @plugin 'tmux-plugins/tpm'

# Tmux yank
set -g @plugin 'tmux-plugins/tmux-yank'

# Dependencies for Catppuccin modules (CPU, RAM, Battery)
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# ==========================
# Catppuccin Theme (Manual)
# ==========================
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load Catppuccin manually. 
# IMPORTANT: Uncomment the line that matches where you cloned the repository!
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# run ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Configure the status line modules AFTER loading the theme
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
